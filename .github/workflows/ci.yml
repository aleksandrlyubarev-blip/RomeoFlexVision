name: ci

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:

jobs:
  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # cffi must be importable before litellm: a cryptography install
          # without its _cffi_backend makes the litellm import chain panic.
          pip install cffi
          pip install -e .[roboqc]
          # rhaef_v2.agents.roboqc imports roboqc_data.prompts at runtime.
          pip install -e ./roboqc_data
      - name: Run tests
        run: pytest -q tests/

  checker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
