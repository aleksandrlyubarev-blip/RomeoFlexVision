name: roboqc_data lint

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "roboqc_data/**"
      - ".github/workflows/roboqc_data_lint.yml"
  pull_request:
    paths:
      - "roboqc_data/**"
      - ".github/workflows/roboqc_data_lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./roboqc_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Lint (ruff check)
        run: ruff check src tests
      - name: Format (ruff format --check)
        run: ruff format --check src tests
