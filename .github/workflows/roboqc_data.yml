name: roboqc_data

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "roboqc_data/**"
      - ".github/workflows/roboqc_data.yml"
  pull_request:
    paths:
      - "roboqc_data/**"
      - ".github/workflows/roboqc_data.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./roboqc_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          # The test extra pins opencv-python-headless: opencv-python is
          # X11-linked on CI runners; the headless build is the supported
          # choice for non-GUI testing. It also brings pytest, which the
          # runtime deps do not.
          pip install -e .[test]
      - name: Run tests
        run: pytest -q
