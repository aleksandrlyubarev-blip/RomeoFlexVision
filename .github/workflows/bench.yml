name: bench-roboqc

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Число фикстур для прогона (--quick режим)"
        default: "5"
  pull_request:
    types: [labeled]

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RHAEF_BACKEND: cloud      # без GPU в CI — роутим на облачный qwen-fallback
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          pip install -e ./roboqc_data

      - name: Unit tests (prompts + graph)
        run: |
          pytest -q tests/test_roboqc_graph.py roboqc_data/tests/test_prompts.py

      - name: Quick bench (cloud fallback)
        if: env.OPENAI_API_KEY != ''
        run: |
          mkdir -p results
          python scripts/bench_roboqc.py --model qwen --n ${{ github.event.inputs.n || '5' }} --quick \
            --out results/qwen.jsonl
          python scripts/bench_roboqc/report.py results/qwen.jsonl --out docs/benchmarks
          cat docs/benchmarks/qwen-vs-gemma.md

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            results/
            docs/benchmarks/qwen-vs-gemma.csv
            docs/benchmarks/qwen-vs-gemma.md
