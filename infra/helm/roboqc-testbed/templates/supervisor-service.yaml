apiVersion: v1
kind: Service
metadata:
  name: {{ include "roboqc-testbed.fullname" . }}-supervisor
  labels:
    {{- include "roboqc-testbed.labels" . | nindent 4 }}
    app.kubernetes.io/component: supervisor
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "roboqc-testbed.name" . }}
    app.kubernetes.io/component: supervisor
  ports:
    - name: http
      port: {{ .Values.supervisor.port }}
      targetPort: http
