{{- range $key, $cfg := .Values.sglang }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roboqc-testbed.fullname" $ }}-sglang-{{ $key }}
  labels:
    {{- include "roboqc-testbed.labels" $ | nindent 4 }}
    app.kubernetes.io/component: sglang-{{ $key }}
spec:
  replicas: {{ $cfg.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "roboqc-testbed.name" $ }}
      app.kubernetes.io/component: sglang-{{ $key }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "roboqc-testbed.name" $ }}
        app.kubernetes.io/component: sglang-{{ $key }}
    spec:
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $.Values.tolerations | nindent 8 }}
      containers:
        - name: sglang
          image: "{{ $.Values.image.sglang.repository }}:{{ $.Values.image.sglang.tag }}"
          imagePullPolicy: {{ $.Values.image.sglang.pullPolicy }}
          command: ["python", "-m", "sglang.launch_server"]
          args:
            - --model-path
            - {{ pluck $key $.Values.models | first | default "" | quote }}
            - --host
            - 0.0.0.0
            - --port
            - {{ $cfg.port | quote }}
            {{- toYaml $cfg.extraArgs | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
          env:
            - name: HF_HOME
              value: {{ $.Values.models.hfHome | quote }}
            - name: TRANSFORMERS_CACHE
              value: {{ $.Values.models.hfHome | quote }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 300
            periodSeconds: 30
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          {{- if $.Values.modelsPvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "roboqc-testbed.fullname" $ }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
{{- end }}
