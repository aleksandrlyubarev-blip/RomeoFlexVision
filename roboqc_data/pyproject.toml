[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboqc-data"
version = "0.1.0"
description = "RoboQC dataset preparation: ingest, synthetic generation (brigada), and training/export adapters for visual QC of AI-hardware manufacturing"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cv = [
    "opencv-python>=4.10",
    "albumentations>=1.4",
    "pillow>=10.4",
    "numpy>=1.26",
]
brigada = [
    "litellm>=1.60",
    "langsmith",
]
train = [
    "anomalib>=1.1",
    "ultralytics>=8.3",
    "transformers>=4.45",
    "torch>=2.4",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[project.scripts]
roboqc-data = "roboqc_data.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["roboqc_data*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI/Typer routinely call functions in default args.
    "UP007", # `Optional[T]` is intentional — keeps strict-mode behaviour explicit.
    "UP042", # `class Foo(str, Enum)` is the documented Pydantic v2 pattern; StrEnum is 3.11+ only.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
