[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboqc-data"
version = "0.1.0"
description = "RoboQC dataset preparation: ingest, synthetic generation (brigada), and training/export adapters for visual QC of AI-hardware manufacturing"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
cv = [
    "opencv-python>=4.10",
    "albumentations>=1.4",
    "pillow>=10.4",
    "numpy>=1.26",
]
brigada = [
    "litellm>=1.60",
    "langsmith",
]
train = [
    "anomalib>=1.1",
    "ultralytics>=8.3",
    "transformers>=4.45",
    "torch>=2.4",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[project.scripts]
roboqc-data = "roboqc_data.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["roboqc_data*"]

[tool.setuptools.package-data]
"roboqc_data.prompts" = ["templates/*.j2"]

[tool.ruff]
line-length = 120
