# GPU профиль для RoboQC testbed.
# Используется как startup-сценарием GPU-VM (см. infra/gcp/modules/gpu-testbed/startup.sh.tftpl),
# так и локально на workstation с NVIDIA GPU:
#   docker compose --env-file .env.testbed -f compose.gpu.yml up -d sglang-qwen rhaef-supervisor
#
# Профили:
#   default     => sglang-qwen + rhaef-supervisor (основной сценарий полигона)
#   gemma       => добавляет sglang-gemma (для side-by-side benchmark)
#   vision      => добавляет sglang-vision (Qwen3-VL)
#   obs         => добавляет prometheus + grafana
#   mock        => rhaef-supervisor в cloud-режиме без SGLang (для CI без GPU)

services:
  sglang-qwen:
    image: lmsysorg/sglang:latest
    container_name: sglang-qwen
    profiles: ["", "default", "qwen"]
    command: >
      python -m sglang.launch_server
      --model-path ${PRIMARY_MODEL_ID:-Qwen/Qwen3.6-35B-A3B-FP8}
      --host 0.0.0.0
      --port 30000
      --enable-mtp
      --tp 1
      --mem-fraction-static 0.85
      --context-length 32768
    ports:
      - "30000:30000"
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models
    environment:
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  sglang-gemma:
    image: lmsysorg/sglang:latest
    container_name: sglang-gemma
    profiles: ["gemma"]
    command: >
      python -m sglang.launch_server
      --model-path ${SECONDARY_MODEL_ID:-google/gemma-4-31b}
      --host 0.0.0.0
      --port 30001
      --tp 1
      --mem-fraction-static 0.85
      --context-length 32768
    ports:
      - "30001:30001"
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models
    environment:
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:30001/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  sglang-vision:
    image: lmsysorg/sglang:latest
    container_name: sglang-vision
    profiles: ["vision"]
    command: >
      python -m sglang.launch_server
      --model-path ${VISION_MODEL_ID:-Qwen/Qwen3-VL-8B-Instruct}
      --host 0.0.0.0
      --port 30002
      --tp 1
      --mem-fraction-static 0.65
    ports:
      - "30002:30002"
    volumes:
      - ${MODELS_DIR:-/srv/models}:/models
    environment:
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:30002/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped

  rhaef-supervisor:
    build:
      context: .
    container_name: rhaef-supervisor
    profiles: ["", "default", "qwen", "gemma", "vision", "mock"]
    ports:
      - "8000:8000"
    environment:
      RHAEF_BACKEND: ${RHAEF_BACKEND:-sglang}
      SGLANG_BASE_URL: ${SGLANG_BASE_URL:-http://sglang-qwen:30000/v1}
      SGLANG_VISION_BASE_URL: ${SGLANG_VISION_BASE_URL:-http://sglang-vision:30002/v1}
      SGLANG_GEMMA_BASE_URL: ${SGLANG_GEMMA_BASE_URL:-http://sglang-gemma:30001/v1}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ROBOQC_MODELS_BUCKET: ${ROBOQC_MODELS_BUCKET:-}
    depends_on: {}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: roboqc-prometheus
    profiles: ["obs"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: roboqc-grafana
    profiles: ["obs"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./infra/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
