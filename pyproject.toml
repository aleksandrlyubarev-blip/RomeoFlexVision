[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rhaef-v2"
version = "2.0.0"
description = "RomeoFlex Hybrid Agentic Execution Framework"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.60",
    "langgraph>=0.2.50",
    "pydantic>=2.10",
    "langsmith",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "pytest",
    # Vertex AI / Gemini route for litellm (vertex_ai/gemini-*). Auth via ADC on Cloud Run.
    "google-cloud-aiplatform>=1.60",
]

[project.optional-dependencies]
roboqc = [
    "jinja2>=3.1",
    "pynvml>=11.5",
    "pyyaml>=6.0",
    "pillow>=10.4",
]

[tool.setuptools.packages.find]
include = ["rhaef_v2*"]

[tool.ruff]
line-length = 120
