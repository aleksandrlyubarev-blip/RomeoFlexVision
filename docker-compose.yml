version: "3.9"

# RHAEF v2 базовый cloud-режим (без GPU). для GPU-полигона RoboQC используйте compose.gpu.yml:
#   docker compose --env-file .env.testbed -f compose.gpu.yml up -d sglang-qwen rhaef-supervisor

services:
  rhaef-api:
    build: .
    container_name: rhaef-v2-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
