version: "3.9"

# RHAEF v2 базовый cloud-режим (без GPU). для GPU-полигона RoboQC используйте compose.gpu.yml:
#   docker compose --env-file .env.testbed -f compose.gpu.yml up -d sglang-qwen rhaef-supervisor

services:
  rhaef-api:
    build: .
    container_name: rhaef-v2-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  # Браузерный голосовой шлюз Romeo (Gemini Live / Grok Voice, см. voice-gateway/.env.example)
  voice-gateway:
    build: ./voice-gateway
    container_name: rfv-voice-gateway
    ports:
      - "8765:8765"
    env_file:
      - path: ./voice-gateway/.env
        required: false
    restart: unless-stopped

  # Remote MCP-сервер инструментов RoboQC для xAI Voice Agent Builder
  roboqc-mcp:
    build: ./voice-gateway
    container_name: rfv-roboqc-mcp
    command: ["node", "dist/mcp-server.js"]
    ports:
      - "8766:8766"
    env_file:
      - path: ./voice-gateway/.env
        required: false
    restart: unless-stopped
